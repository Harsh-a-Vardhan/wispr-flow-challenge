<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're 7th in Line (#TisFAR)</title>
<meta name="description" content="A Bengaluru queue game and portfolio by Harsha Vardhan, built by voice with Wispr Flow.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFDF0; --paper:#FFFFFF; --cream:#FFF7DA; --ink:#1A1A1A; --muted:#625c52; --line:#E8E1CC;
  --lav:#E9D8FB; --lav-2:#F4ECFF; --coral:#FF6B4A; --mustard:#FFB547; --green:#0F4C3A; --pink:#F7B9E1; --maroon:#7A1F3D;
  --t-partnerships:#D9472A; --t-systems:#0F6B52; --t-scale:#7A3FB0; --t-build:#2F64B0; --t-ops:#A8690B; --t-growth:#C03A82;
  --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#app{max-width:1040px;margin:0 auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px;min-height:100dvh}

/* HUD */
.hud{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:400;font-size:clamp(30px,5vw,44px);letter-spacing:-.01em;line-height:1}
.brand i{font-style:italic}
.brand .tag{font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0;vertical-align:middle;margin-left:4px}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12.5px;color:var(--muted);letter-spacing:0;margin-top:6px}
.stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stat{background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;white-space:nowrap}
.stat b{font-weight:700;font-size:15px;margin-left:5px}
.stat.low{background:#FFE3DA}
.peek{background:var(--lav);border:1.5px solid var(--ink);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}
.peek:hover{background:#dfc6fa}
.peek:disabled{background:#efeae0;color:var(--muted);border-color:#cfc7b6;cursor:not-allowed}

/* Street scene */
.street{position:relative;display:grid;grid-template-columns:minmax(0,1fr) clamp(70px,17%,160px);border:1.5px solid var(--ink);border-radius:26px;overflow:hidden;
  background:var(--cream);min-height:clamp(240px,33vw,310px)}
.ground{position:absolute;left:0;right:0;bottom:0;height:34%;background:var(--lav);border-top:1.5px solid var(--ink)}
.deco{position:absolute;pointer-events:none}
.deco.bush{left:1%;bottom:calc(34% - 5px);width:clamp(64px,12vw,124px)}
.deco.bush2{left:clamp(52px,10.5vw,112px);bottom:calc(34% - 4px);width:clamp(36px,6.5vw,66px)}
.deco.sun{left:70%;top:6%;width:clamp(46px,7vw,72px)}
.deco.cloud{left:20%;top:9%;width:clamp(58px,10vw,104px)}
.deco.cloud2{left:46%;top:20%;width:clamp(40px,7vw,72px)}
.deco.squig{left:5%;top:12%;width:clamp(44px,7vw,74px);color:var(--coral)}
.deco.squig2{left:58%;top:8%;width:clamp(30px,5vw,52px);color:var(--green)}
.deco.stars{left:36%;top:6%;width:clamp(30px,5vw,48px)}
.deco.grass{left:0;right:0;bottom:calc(34% - 2px);width:100%;height:14px}
.queue{position:relative;display:flex;align-items:flex-end;justify-content:flex-end;gap:clamp(2px,1.2vw,14px);padding:0 clamp(4px,1.5vw,16px) 14px;z-index:1}
.person{appearance:none;background:none;border:0;padding:0;width:clamp(30px,9.4vw,96px);flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative}
.person svg{width:100%;height:auto;display:block;transition:transform .2s}
.person:hover svg{transform:translateY(-3px) rotate(-1deg)}
.person .nm{font-weight:700;font-size:clamp(10px,1.35vw,13px);line-height:1.1;text-align:center}
.person .tg{font-size:11px;color:var(--muted);text-align:center;line-height:1.15;min-height:13px}
.chips{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:18px}
.chip{font-size:10px;font-weight:700;border-radius:999px;padding:2px 7px;border:1.5px solid var(--ink);background:#fff;line-height:1.25;white-space:nowrap}
.chip.q{color:var(--muted);border-color:#bdb4a2}
.chip.weak{color:#fff}
.chip.imm{background:#fff;text-decoration:line-through}
.chip.tried{background:#f3eee4;color:var(--muted);border-color:#bdb4a2;text-decoration:line-through}
.person.you .nm{color:var(--coral)}
.person.you::before{content:"";position:absolute;left:8%;right:8%;bottom:34px;height:10px;border-radius:50%;background:rgba(255,107,74,.28)}
.person.out svg{filter:grayscale(.6);opacity:.5}
.person.out .nm,.person.out .tg{opacity:.55}
.person.out:hover svg{transform:none}
.armed .person.rival svg{animation:bob 1s ease-in-out infinite}
.armed .person.rival::after{content:"";position:absolute;inset:-4px -2px auto;height:calc(100% + 6px);border:1.5px dashed var(--coral);border-radius:16px;pointer-events:none}
@keyframes bob{50%{transform:translateY(-4px)}}
.person.shake svg{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.office{position:relative;z-index:1;border-left:1.5px solid var(--ink);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 8px}
.awning{position:absolute;top:0;left:0;right:0;height:22px;border-bottom:1.5px solid var(--ink);
  background:repeating-linear-gradient(90deg,var(--coral) 0 14px,#fff 14px 28px)}
.awning::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:9px;
  background:radial-gradient(circle at 7px 0,var(--coral) 6px,transparent 6.5px) 0 0/28px 9px,radial-gradient(circle at 21px 0,#fff 6px,transparent 6.5px) 0 0/28px 9px}
.sign{position:absolute;top:40px;left:8px;right:8px;background:var(--ink);color:#fff;border-radius:999px;padding:7px 4px;text-align:center;font-family:var(--serif);font-size:clamp(13px,1.9vw,19px);line-height:1}
.live{position:absolute;top:84px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--ink);border-radius:10px;padding:5px 8px;
  font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1.15;white-space:nowrap}
.live .ls{display:none}
.lamp{width:10px;height:10px;border-radius:50%;background:#ff2b2b;border:1.5px solid var(--ink);flex:none;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(255,43,43,.0);background:#ff2b2b}50%{box-shadow:0 0 10px 4px rgba(255,43,43,.55);background:#ff7a7a}}
.door{width:66%;height:46%;background:var(--green);border:1.5px solid var(--ink);border-bottom:0;border-radius:40px 40px 0 0;position:relative}
.door::after{content:"";position:absolute;right:14%;top:52%;width:7px;height:7px;border-radius:50%;background:var(--mustard);border:1.5px solid var(--ink)}
.door.open{background:#1a1a1a}
.step{width:calc(100% + 16px);height:14px;background:var(--pink);border-top:1.5px solid var(--ink)}

/* Speech */
.speech{background:var(--paper);border:1.5px solid var(--ink);border-radius:22px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start;min-height:96px}
.sp-av{width:48px;flex:none}
.sp-av svg{width:100%;height:auto;display:block}
.sp-body{flex:1;min-width:0}
.sp-name{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.sp-name svg{width:34px;height:12px;color:var(--coral);flex:none}
.sp-text{font-size:15.5px;line-height:1.45;margin-top:4px}
.receipt{margin-top:9px;border-radius:14px;padding:9px 12px;background:var(--lav-2);font-size:13px;line-height:1.5;border:1.5px solid #d9c4f5}
.receipt b{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:2px}
.receipt.bad{background:#FFF0EA;border-color:#ffc9b8}
.receipt.bad b{color:var(--coral)}
.fx{font-weight:700}
.fx.good{color:var(--green)}.fx.bad{color:#d9472a}

/* Hand */
.prompt{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prompt .dot{width:8px;height:8px;border-radius:50%;background:var(--coral);flex:none}
.hand{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.card{appearance:none;text-align:left;background:var(--paper);border:1.5px solid var(--ink);border-radius:20px;padding:13px 14px 14px;cursor:pointer;
  transition:transform .15s,background .15s;display:flex;flex-direction:column;gap:5px;min-height:122px;position:relative}
.card:hover{transform:translateY(-3px)}
.card.sel{background:var(--lav);transform:translateY(-5px);border-width:2px;box-shadow:0 10px 24px rgba(122,63,176,.18)}
.card .ty{align-self:flex-start;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tc);
  background:color-mix(in srgb,var(--tc) 13%,#fff);border-radius:999px;padding:3px 9px}
.card h3{margin:2px 0 0;font-family:var(--serif);font-weight:400;font-size:clamp(19px,2.3vw,24px);line-height:1.05}
.card p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.35}
.card .wh{margin-top:auto;font-size:11px;font-weight:700;color:var(--ink);opacity:.75}
.card.obs{background:#FFF1CF;--tc:#8a5a00}
.card.obs.sel{background:var(--mustard)}
.card:disabled{opacity:.5;cursor:not-allowed}
.tray{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.tray .chip{color:#fff}
.tray .chip.rc{cursor:pointer;font:inherit;font-size:11px;font-weight:700;padding:3px 10px}
.tray .chip.rc:hover{transform:translateY(-1px)}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:auto;padding-top:6px}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(26,26,26,.45);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .2s}
.overlay[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.modal{background:var(--bg);border:1.5px solid var(--ink);border-radius:26px;box-shadow:0 24px 70px rgba(0,0,0,.22);max-width:580px;width:100%;padding:26px;max-height:90dvh;overflow:auto;animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.modal h2{font-family:var(--serif);font-weight:400;font-size:clamp(32px,6vw,44px);letter-spacing:-.01em;margin:0 0 6px;line-height:1.02}
.modal h2 i{font-style:italic}
.modal .kicker{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--coral);margin-bottom:8px}
.modal p{line-height:1.55;margin:8px 0}
.modal ul{padding-left:18px;margin:10px 0;line-height:1.55}
.modal li{margin:4px 0}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{appearance:none;border:1.5px solid var(--ink);border-radius:999px;padding:12px 22px;font-weight:600;font-size:15px;cursor:pointer;background:var(--ink);color:#fff;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.alt{background:#fff;color:var(--ink)}
.btn:disabled{background:#efeae0;color:var(--muted);cursor:not-allowed}
.cheat table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.cheat th,.cheat td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
.cheat th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.timer{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:12px}
.timer i{display:block;height:100%;background:var(--coral);width:100%}
.timer.run i{animation:drain 2s linear forwards}
@keyframes drain{to{width:0}}
.rec-list{display:grid;gap:8px;margin-top:10px}
.rec{border:1.5px solid var(--ink);border-radius:16px;padding:11px 13px;background:#fff}
.rec h4{margin:2px 0 3px;font-family:var(--serif);font-weight:400;font-size:21px}
.rec p{margin:0;font-size:13px;line-height:1.45}
.rec .wh{font-size:10.5px;font-weight:700;color:var(--tc);text-transform:uppercase;letter-spacing:.06em;background:color-mix(in srgb,var(--tc) 13%,#fff);border-radius:999px;padding:2px 8px}
.scoreline{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.lose-hero{display:flex;align-items:center;gap:14px;margin:4px 0 12px}
.lose-hero svg{width:90px;flex:none}
.bubble-q{position:relative;background:#fff;border:1.5px solid var(--ink);border-radius:18px;padding:11px 15px;font-weight:600;line-height:1.4}
.bubble-q::before{content:"";position:absolute;left:-8px;top:50%;width:13px;height:13px;background:#fff;border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:translateY(-50%) rotate(45deg)}
.tear{transform-box:fill-box;animation:drip 1.3s ease-in infinite}
.tear.t2{animation-delay:.6s}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(9px);opacity:0}}
.lesson-tag{display:inline-block;background:var(--lav);border:1.5px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700}

@media (max-width:720px){
  .live .lt{display:none}
  .live .ls{display:inline}
  .hand{grid-template-columns:repeat(2,minmax(0,1fr))}
  .person .tg{display:none}
  .card{min-height:108px}
  .card p{font-size:12px}
}
@media (max-width:420px){
  .queue{gap:2px;padding:0 3px 12px}
  .person .nm{font-size:10px}
  .person.you::before{bottom:30px}
  .chip{font-size:9px;padding:1px 4px}
  .stat{padding:5px 10px;font-size:12px}
  .stat b{font-size:14px}
  .sign{left:4px;right:4px;top:34px;font-size:12px}
  .live{top:66px;padding:4px 6px;font-size:9px}
  .awning{height:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Themes (window dressing) ===== */
.street{--sky:var(--cream);--groundc:var(--lav);--doorc:var(--green);--aw1:var(--coral);--aw2:#fff;--facade:#fff;--lab:var(--ink);--labsub:var(--muted);background:var(--sky)}
.street .ground{background:var(--groundc)}
.street .door{background:var(--doorc)}
.street .office{background:var(--facade)}
.street .awning{background:repeating-linear-gradient(90deg,var(--aw1) 0 14px,var(--aw2) 14px 28px)}
.street .awning::after{background:radial-gradient(circle at 7px 0,var(--aw1) 6px,transparent 6.5px) 0 0/28px 9px,radial-gradient(circle at 21px 0,var(--aw2) 6px,transparent 6.5px) 0 0/28px 9px}
.person .nm{color:var(--lab)}
.person .tg{color:var(--labsub)}
.person.you .nm{color:var(--coral)}
#deco{position:absolute;inset:0;z-index:0;pointer-events:none}
.theme-store{--sky:#E9D8FB;--groundc:#FFE3A8;--doorc:#FF6B4A;--aw1:#0F4C3A;--aw2:#fff}
.theme-cafe{--sky:#FFF1CF;--groundc:#F7B9E1;--doorc:#7A1F3D;--aw1:#FF6B4A;--aw2:#FFF7DA}
.theme-bar{--sky:#1C2340;--groundc:#4a2348;--doorc:#111;--aw1:#7A1F3D;--aw2:#F7B9E1;--facade:#2a2f4a;--lab:#fff;--labsub:#d9d3f0}
.theme-panel{--sky:#F4ECFF;--groundc:#E8D3B5;--doorc:#03504A;--aw1:#03504A;--aw2:#FFFDE8}
.theme-bar .sign{background:#111;color:#F7B9E1;box-shadow:0 0 14px rgba(247,185,225,.75);border:1.5px solid #F7B9E1}
.theme-bar .live{background:#111;color:#fff;border-color:#F7B9E1}
.theme-bar .step{background:#7A1F3D}
.theme-bar .ground{border-top-color:#F7B9E1}
.theme-bar.hh-over .lamp{animation:none;background:#555}
.ground.floor{background:repeating-linear-gradient(90deg,#E8D3B5 0 46px,#d9c19e 46px 47.5px)}
.office{justify-content:flex-start;padding:34px 8px 0;gap:8px}
.office .sign{position:static;width:100%;font-size:clamp(12px,1.7vw,18px);padding:7px 8px;line-height:1.05}
.office .live{position:static;transform:none;max-width:100%}
.office .door{margin-top:auto}
.office .step{width:calc(100% + 16px);margin:0 -8px}
.facade-icon{width:36px}
.facade-icon svg{width:100%;height:auto;display:block}

.deco.window{left:3%;top:8%;width:clamp(78px,13vw,136px)}
.deco.board{left:38%;top:6%;width:clamp(90px,15vw,150px)}
.deco.clock{left:72%;top:8%;width:clamp(28px,4vw,40px)}
.deco.plant{left:1%;bottom:calc(34% - 4px);width:clamp(28px,5vw,50px)}
.deco.bags{left:4%;top:9%;width:clamp(60px,10vw,96px)}
.deco.tagd{left:60%;top:10%;width:clamp(56px,9vw,82px)}
.deco.rack{left:0;bottom:calc(34% - 4px);width:clamp(56px,10vw,110px)}
.deco.cup{left:5%;top:9%;width:clamp(50px,8vw,80px)}
.deco.croissant{left:38%;top:12%;width:clamp(40px,6vw,64px)}
.deco.umbrella{left:0;bottom:calc(34% - 6px);width:clamp(52px,9vw,96px)}
.deco.lights{left:0;top:0;width:100%;height:40px}
.deco.moon{left:72%;top:16%;width:clamp(30px,4.5vw,46px)}
.deco.nstars{left:12%;top:20%;width:55%}
.deco.neon{left:16%;top:12%;width:clamp(48px,8vw,80px)}
.deco.barrel{left:1%;bottom:calc(34% - 4px);width:clamp(84px,15vw,160px)}

/* ===== Big lines (Free Play): scroll on narrow screens ===== */
.street.big .queue{justify-content:flex-start;overflow-x:auto;overflow-y:hidden;padding-top:44px;scrollbar-width:thin}
.street.big .queue > :first-child{margin-left:auto}
.street.big .person{width:clamp(36px,6.4vw,70px)}
.street.big .person .tg{display:none}
.more{align-self:flex-end;flex:none;font-size:11px;font-weight:700;background:#fff;color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:3px 8px;margin-bottom:64px;white-space:nowrap}

/* ===== Panel ===== */
.gap{flex:0 1 9%}
.theme-panel .person{--w:clamp(50px,11vw,104px);width:var(--w)}
.panelrow{--w:clamp(50px,11vw,104px);display:flex;align-items:flex-end;gap:clamp(4px,1.6vw,18px);position:relative;flex:none}
.panelrow::after{content:"";position:absolute;left:-12px;right:-12px;top:calc(var(--w) * 1.02);height:calc(var(--w) * .42);background:#fff;border:1.5px solid var(--ink);border-radius:10px;z-index:2;box-shadow:0 6px 0 -2px #d9c19e;pointer-events:none}
.person.panelist .nm{position:relative;z-index:3;margin-top:4px}
.person.panelist .chips{position:relative;z-index:3}
.person.panelist.done svg{transform:translateY(-2px)}
.chip.ok{background:#0F6B52;color:#fff;border-color:#0F6B52}
.chip.lead{background:var(--mustard);color:var(--ink)}
.chip.grp{background:var(--lav);color:var(--ink)}

/* ===== Cards: colour strip on the left ===== */
.card{overflow:hidden;padding-left:20px}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--tc,#bdb4a2);border-right:1.5px solid var(--ink)}
.card.obs::before{background:var(--mustard)}
.card.special{background:linear-gradient(135deg,#FFF1CF,#F7B9E1);border-width:2px;--tc:#FF6B4A;animation:glow 1.6s ease-in-out infinite}
.card.special.sel{background:var(--lav)}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(255,107,74,.25)}}

/* ===== Modals: slots, tiles, board, finale ===== */
.modal.wide{max-width:880px}
.note{font-size:13px;color:var(--muted);background:var(--lav-2);border-radius:12px;padding:9px 12px;line-height:1.5}
.muted{color:var(--muted);font-size:13px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.reel{border:1.5px solid var(--ink);border-radius:18px;background:#fff;padding:10px 6px 12px;text-align:center;overflow:hidden}
.reel-face{height:120px;display:flex;justify-content:center}
.reel-face svg{height:100%;width:auto}

.tile p{margin:2px 0;font-size:13px;line-height:1.45}
.tile .prize{font-weight:700;color:var(--coral)}

.tile .btn{margin-top:auto;align-self:flex-start;padding:9px 16px;font-size:14px}
.theme-bar.tile .btn{background:#F7B9E1;color:var(--ink)}
.seat{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:auto}
.seat input{font:inherit;font-size:15px;font-weight:600;text-transform:none;letter-spacing:0;border:1.5px solid var(--ink);border-radius:12px;padding:8px 10px;background:#fff;color:var(--ink)}
.seat.solo{margin-top:14px;color:var(--muted)}
.board{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.board th,.board td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.board th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.board td span{font-size:12px;color:var(--muted)}
.board tr.me{background:var(--lav-2)}
.board tr.npc{color:var(--muted)}
.finale{text-align:center}
.finale h2{margin-top:10px}
.crowd{display:flex;justify-content:center;flex-wrap:wrap;gap:2px;padding-top:18px}
.fan{width:46px;position:relative;animation:jump .9s ease-in-out infinite}
.fan svg{width:100%;height:auto;display:block}
.cheer{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:1px 7px;white-space:nowrap;color:var(--coral)}
@keyframes jump{50%{transform:translateY(-7px)}}
.front{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin-top:-6px}
.pp{width:80px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center}
.pp svg{width:100%;height:auto;display:block}
.pp.me{width:112px;color:var(--coral)}
.yesno{display:flex;justify-content:center;gap:12px;margin:14px 0 6px;min-height:64px;align-items:center}
.contact{display:flex;flex-direction:column;align-items:center;gap:10px}
.contact .btn{min-width:250px;text-decoration:none;text-align:center}

@media (max-width:720px){

  .tiles{grid-template-columns:1fr}

  .pp{width:60px}.pp.me{width:84px}

.theme-store .step{background:#FF6B4A}
.theme-store .facade-icon{width:40px}
.ground.concrete{background:repeating-linear-gradient(90deg,#D6D0C4 0 90px,#cbc4b6 90px 91.5px)}
.deco.bricks{left:0;top:0;width:100%;height:66%}

.deco.boxes{left:0;bottom:calc(34% - 6px);width:clamp(44px,7vw,70px)}
.mascot{position:absolute;top:10%;left:44%;width:clamp(42px,6.5vw,66px);background:none;border:0;padding:0;cursor:pointer;z-index:3}
.mascot svg{width:100%;height:auto;display:block;animation:float 2.6s ease-in-out infinite}

.mascot:hover svg{animation-play-state:paused}
.mascot.hop svg{animation:hop .45s ease-out}

.mascot[hidden]{display:none}

</head>

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
let rand = mulberry32((Math.random()*2**32)>>>0);
function shuffle(arr, r=rand){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pick = (arr, r=rand) => arr[Math.floor(r()*arr.length)];

/* ---------- Procedural people (boss rounds + Free Play) ---------- */
function genPerson(line, arch, r, used, idx){
  let name; let tries = 0;
  const pool = arch.g === "f" ? FEMALE_NAMES : arch.g === "m" ? MALE_NAMES : FIRST_NAMES;
  do { name = pick(pool, r); tries++; } while(used.has(name) && tries < 60);
  used.add(name);
  const weak = arch.weak.slice(), immune = arch.immune.slice();
  let tag = "";
  if(r() < 0.5){
    const m = pick(MOODS, r);
    if(m.weak && !weak.includes(m.weak) && !immune.includes(m.weak)) weak.push(m.weak);
    if(m.immune && !weak.includes(m.immune) && !immune.includes(m.immune)) immune.push(m.immune);
    tag = m.tag;
  }
  return {
    id:`${line.id}-${idx}-${name}`, name, title:arch.title, tag, gen:true, arch:arch.k,
    look:{skin:pick(SKINS,r), hair:arch.hair, hc:pick(HAIRC,r), shirt:pick(SHIRTS,r), pants:pick(PANTS,r), shoes:pick(SHOES,r), acc:arch.acc, mood: r()<.3 ? "smug" : undefined},
    quote:arch.quote, hidden:arch.hidden, weak, immune, bounce:arch.bounce, group:null, leader:false
  };
}
function genLine(line, count, r, {poolSize=6, groups=false}={}){
  const pool = line.archetypes.slice(0, poolSize);
  const used = new Set();
  let bag = [];
  const people = [];
  for(let i=0;i<count;i++){
    if(!bag.length) bag = shuffle(pool, r);
    people.push(genPerson(line, bag.pop(), r, used, i));
  }
  if(groups && count >= 5){
    const size = r() < 0.5 ? 2 : 3;
    const start = 1 + Math.floor(r() * (count - size - 1));
    const gid = "g1";
    const leader = people[start];
    for(let i=start;i<start+size;i++){
      people[i].group = gid;
      if(i === start){ people[i].leader = true; people[i].tag = `group of ${size}`; }
      else people[i].tag = `with ${leader.name}`;
    }
  }
  return {people, used};
}

function dressScene(theme, opts={}){

  st.className = "street theme-" + theme + (opts.big ? " big" : "");
  $("deco").innerHTML = DECO[theme] || "";
  $("facadeIcon").innerHTML = FACADE[theme] || "";

/* ---------- App state ---------- */
const APP = {
  storyDone: !!store.get("storyDone", false),
  names: ["Growth Lead","Partnerships Lead","Founder"],
  round: 0, results: [], beaten: [], runs: {}, done: {}
};
const peekState = {left: 2, locked: false};
let S;

/* ---------- Runs ---------- */
function newStory(){
  dressScene("story");
  S = {
    mode:"story", line:null, player:{name:"You", sub:"Harsha", look:{custom:"harsha"}},
    rivals: LINEUP.map(r => ({...r, weak:[r.weak], immune:[r.immune], seen:false, immSeen:[], tried:[]})),
    beatBy:{}, out:[], lastOut:null, moves:10, maxMoves:10, cost:1, used:0,
    score:0, gained:0, backfires:0, observes:0, hand:[], spent:[], sel:null, busy:false, lessonIdx:0, over:false
  };
  draw();
}

function newRun(mode, lineId, playerName, playerLook){
  const line = LINES[lineId];
  const free = mode === "free";
  // Boss rounds: a brand-new line every playthrough. Free Play: one line per day, shared by everyone.
  const seed = free ? hashStr(todayKey() + "|" + lineId + "|" + mode) : (Math.random()*2**32)>>>0;
  const r = mulberry32(seed);
  const count = free ? 10 : 4;
  const {people, used} = genLine(line, count, r, {poolSize: free ? 8 : 6, groups: free});
  const moves = free ? 15 : ROUND_MOVES[lineId];
  dressScene(line.theme, {sign: line.brand, live: line.live, liveShort: line.shortLive, big: free});
  S = {
    mode, line, rng: r, names: used, player:{name: playerName, sub: free ? "You" : "Panelist", look: playerLook},
    rivals: people.map(p => ({...p, seen:false, immSeen:[], tried:[]})),
    beatBy:{}, out:[], lastOut:null, moves, maxMoves:moves, cost:1, used:0,
    score:0, gained:0, backfires:0, observes:0, chains:0, hand:[], spent:[], sel:null, busy:false, lessonIdx:99, over:false,
    stock: line.twist === "stock" ? moves - 1 : null,
    cutAt: line.twist === "cutin" ? (free ? 4 : 2) : null, cutDone:false,
    hhAt: line.twist === "happyhour" ? (free ? 8 : 3) : null, hhOver:false
  };
  draw();
}

function deckCards(){
  if(S.mode === "story") return CARDS.filter(c => !S.spent.includes(c.id)).map(c => ({...c, key:c.type}));
  return S.line.deck.map(id => ({id, key:id, title:GAG[id].title, short:GAG[id].short, where: ["prank","prod","celeb","light","nextdoor","crypto","rain"].includes(id) ? "Works in any line" : `${S.line.brand} special`, c:GAG[id].c}));
}
// Every hand of 3 must contain at least one card that is someone's weak spot in the line
function handWorks(hand){ return hand.some(c => S.rivals.some(r => r.weak.includes(c.key))); }
function draw(){
  const pool = deckCards();
  const r = S.rng || rand;
  let hand = shuffle(pool, r).slice(0, 3);
  const possible = pool.some(c => S.rivals.some(x => x.weak.includes(c.key)));
  for(let t = 0; t < 40 && possible && !handWorks(hand); t++) hand = shuffle(pool, r).slice(0, 3);
  S.hand = hand;
}
// After a move: keep the hand. Only a card that worked leaves it (and a new one is drawn).
// Observe, a miss or a backfire never reshuffles. The checker still guarantees one playable card.
function refillHand(){
  const r = S.rng || rand;
  const pool = deckCards();
  if(S.playedHit) S.hand = S.hand.filter(c => c.id !== S.playedHit);
  S.playedHit = null;
  S.hand = S.hand.filter(c => pool.some(p => p.id === c.id)); // drop anything no longer in the deck
  let spare = shuffle(pool.filter(p => !S.hand.some(c => c.id === p.id)), r);
  while(S.hand.length < 3 && spare.length) S.hand.push(spare.shift());
  if(!handWorks(S.hand)){
    const fix = spare.find(c => S.rivals.some(x => x.weak.includes(c.key)));
    if(fix){
      const dead = S.hand.findIndex(c => !S.rivals.some(x => x.weak.includes(c.key)));
      S.hand[dead >= 0 ? dead : S.hand.length - 1] = fix;
    }
  }
}

/* ---------- HUD ---------- */
function renderHud(){
  let title, sub;
  if(S.mode === "story"){ title = `You're <i>7th</i> in line <span class="tag">(#TisFAR)</span>`; sub = APP.storyDone ? "Level 1 · You're back in line. Free Play is unlocked." : "Level 1 · The applicant queue"; }
  else if(S.mode === "panel"){ title = `The <i>panel</i>`; sub = "Boss level · Three questions"; }
  else if(S.mode === "round"){ title = `${esc(S.line.brand)}`; sub = `Boss level · Played by ${esc(S.player.name)} · ${Object.keys(APP.done).length} of 3 lines finished`; }
  else { title = `${esc(S.line.brand)}`; sub = `Free Play · ${esc(S.line.tagline)} · Today's line`; }
  $("brandTitle").innerHTML = title; $("brandSub").innerHTML = sub;

  let html = "";
  if(S.mode === "panel"){
    html += `<span class="stat">Convinced<b>${PANEL.filter(p => S.done[p.id]).length}/3</b></span>`;
  } else {
    html += `<span class="stat${S.moves <= 2 ? " low" : ""}">Moves<b>${S.moves}</b></span>`;
    html += `<span class="stat">Spot<b>${ord(S.rivals.length + 1)}</b></span>`;
    html += `<span class="stat">Score<b>${S.score}</b></span>`;
    if(S.stock !== null && S.stock !== undefined) html += `<span class="stat${S.stock <= 2 ? " low" : ""}">Pieces left<b>${S.stock}</b></span>`;
    if(S.hhAt) html += `<span class="stat${S.hhOver ? " low" : ""}">${S.hhOver ? "Happy hour over · moves cost" : "Happy hour"}<b>${S.hhOver ? "×2" : "on"}</b></span>`;
    if(S.cutAt) html += `<span class="stat">Cut-in<b>${S.cutDone ? "happened" : "after move " + S.cutAt}</b></span>`;
  }
  if(S.mode === "story") html += `<button class="peek" id="peekBtn" type="button" ${peekState.locked ? "disabled" : ""}>${peekState.locked ? "No more peeks" : `Peek at cheat sheet (${peekState.left})`}</button>`;
  if(APP.storyDone && (S.mode === "story" || S.mode === "free")) html += `<button class="peek sel" id="lvlBtn" type="button">Level select</button>`;
  $("stats").innerHTML = html;
  if($("peekBtn")) $("peekBtn").onclick = peek;
  if($("lvlBtn")) $("lvlBtn").onclick = levelSelect;
}

function personBtn(cls, id, look, name, sub, chips, aria, badges=""){

  b.className = "person " + cls; b.type = "button"; b.dataset.id = id;
  if(aria) b.setAttribute("aria-label", aria);
  b.innerHTML = `<span class="badges">${badges}</span>${avatar(look)}<span class="nm">${esc(name)}</span><span class="tg">${esc(sub || "")}</span><span class="chips">${chips || ""}</span>`;
  return b;
}
/* Icons above heads: what you know about someone. Tap them for the details. */
const ICON = {
  weak:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>`,
  meh:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 10h.01M15.5 10h.01M8.5 15h7"/></svg>`,
  back:`<svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>`
};
const badge = (kind, n, title) => n ? `<span class="bdg" title="${title}">${ICON[kind]}${n > 1 ? `<i>×${n}</i>` : ""}</span>` : "";
function rivalBadges(r){
  const weak = r.seen ? r.weak.length : 0;
  const back = r.seen ? r.immune.length : r.immSeen.length;
  return badge("weak", weak, "Weak spot found") + badge("meh", r.tried.length, "Tried, no effect") + badge("back", back, "Backfires");
}
function rivalChips(r){
  if(r.leader) return `<span class="chip lead">Leader</span>`;
  if(r.group) return `<span class="chip grp">Group</span>`;
  return "";
}
function renderQueue(){
  const q = $("queue");
  const before = {};
  q.querySelectorAll(".person").forEach(el => { before[el.dataset.id] = el.getBoundingClientRect().left; });
  q.innerHTML = "";

  if(S.mode === "panel"){
    const you = personBtn("you", "you", {custom:"harsha"}, "You", "Harsha", "");
    you.onclick = () => say({name:"Harsha", title:"That's you", look:{custom:"harsha"}}, "Three people, three questions. Answer with what you actually did.");
    q.appendChild(you);
    const gap = document.createElement("span"); gap.className = "gap"; q.appendChild(gap);
    const row = document.createElement("div"); row.className = "panelrow";
    PANEL.forEach(p => {
      const done = S.done[p.id];
      const b = personBtn("panelist" + (done ? " done" : ""), p.id, p.look, p.role, "", done ? `<span class="chip ok">Convinced</span>` : `<span class="chip q">Asking</span>`, p.role);
      b.onclick = () => onPanelist(p.id);
      row.appendChild(b);
    });
    q.appendChild(row);
    $("street").classList.toggle("armed", !!S.sel);
    return;
  }

  const outShown = S.mode === "free" ? S.out.slice(0, 3) : S.out;
  const hidden = S.out.length - outShown.length;
  if(hidden > 0){ const more = document.createElement("span"); more.className = "more"; more.textContent = `+${hidden} behind`; q.appendChild(more); }
  [...outShown].reverse().forEach(r => {
    const b = personBtn("out", r.id, r.look, r.name, "Behind you now", `<span class="chip q">Out</span>`, `${r.name}, now behind you`);
    b.onclick = () => { if(!S.busy) say(r, `${esc(r.name)} is behind you now, sulking. <span class="fx">Nothing more to play here.</span>`); };
    q.appendChild(b);
  });
  const you = personBtn("you", "you", S.player.look, S.mode === "story" ? "You" : S.player.name, S.player.sub, "");
  you.onclick = () => { if(!S.busy) say({name:S.player.name, title:"That's you", look:S.player.look}, S.mode === "story" ? "That's me. Six people ahead, ten moves, one door. Every card in my hand is something I actually did." : "That's you. Get to the door before the line wins."); };
  q.appendChild(you);
  [...S.rivals].reverse().forEach(r => {
    const b = personBtn("rival", r.id, r.look, r.name, r.title, rivalChips(r), `${r.name}, ${r.title}`, rivalBadges(r));
    b.onclick = () => onRival(r.id, b);
    q.appendChild(b);
  });

  q.querySelectorAll(".person").forEach(el => {
    const was = before[el.dataset.id];
    if(was === undefined || !el.animate) return;
    const dx = was - el.getBoundingClientRect().left;
    if(Math.abs(dx) < 1) return;
    if(el.dataset.id === S.lastOut){
      el.animate([{transform:`translate(${dx}px,0)`},{transform:`translate(${dx*0.5}px,-34px) rotate(-6deg)`},{transform:"none"}], {duration:900, easing:"ease-in-out"});
    } else {
      el.animate([{transform:`translateX(${dx}px)`},{transform:"none"}], {duration:650, easing:"cubic-bezier(.2,.8,.2,1)", delay: el.dataset.id==="you" ? 120 : 0});
    }
  });
  S.lastOut = null;
  $("street").classList.toggle("armed", !!S.sel);
  // keep "you" in view when the line scrolls (Free Play on phones)
  const youEl = q.querySelector(".person.you");
  if(youEl && q.scrollWidth > q.clientWidth) q.scrollLeft = Math.max(0, youEl.offsetLeft - q.clientWidth * 0.35);
}

/* ---------- Play ---------- */
function onRival(id, el){
  if(S.busy || S.over) return;
  const r = S.rivals.find(x => x.id === id);
  if(!r) return;
  if(!S.sel){
    const notes = [];
    if(r.tried.length) notes.push(`No effect: ${r.tried.map(keyLabel).join(", ")}.`);
    if(r.immSeen.length && !r.seen) notes.push(`Backfires: ${r.immSeen.map(keyLabel).join(", ")}.`);
    if(r.seen) notes.push(`Weak to ${r.weak.map(keyLabel).join(", ")}. Immune to ${r.immune.map(keyLabel).join(", ") || "nothing"}.`);
    if(r.leader) notes.push(`Leads a group: if ${r.name} leaves, the whole group follows.`);
    say(r, esc(`"${r.quote}"`), notes.length ? `<div class="receipt"><b>Your notes on ${esc(r.name)}</b>${esc(notes.join(" "))}</div>` : "");
    return;
  }
  play(S.sel, r, el);
}

function exitLine(r, key){
  if(!r.gen) return r.exit;
  return pick(GAG_EXITS[key]).replaceAll("{n}", r.name);
}

function play(cardId, r, el){
  if(S.moves < S.cost){ return; }
  S.busy = true;
  S.moves -= S.cost; S.used++;
  S.sel = null;
  let delay = 900;
  if(S.stock !== null && S.stock !== undefined) S.stock = Math.max(0, S.stock - 1);

  if(cardId === "observe"){
    S.observes++;
    r.seen = true;
    say(r, `<span class="fx">You watch ${esc(r.name)} for a minute.</span> ${esc(r.hidden)}`,
      `<div class="receipt"><b>Read</b>Weak to ${r.weak.map(keyLabel).join(", ")}. Immune to ${r.immune.map(keyLabel).join(", ") || "nothing"}.</div>`);
    delay = 250;
  } else {
    const card = S.mode === "story" ? {...CARDS.find(c => c.id === cardId), key: CARDS.find(c => c.id === cardId).type} : {id:cardId, key:cardId, title:GAG[cardId].title};
    if(r.weak.includes(card.key)){
      // who leaves: the person, or the whole group if they lead one
      const leaving = r.leader ? S.rivals.filter(x => x.group === r.group) : [r];
      const n = leaving.length;
      S.score += 100 * n + (n > 1 ? 75 : 0); S.gained += n;
      if(n > 1) S.chains++;
      S.playedHit = card.id;
      if(S.mode === "story"){ S.spent.push(card.id); S.beatBy[card.id] = r.id; }
      const chain = n > 1 ? ` <span class="fx good">Chain! The whole group of ${n} follows. +${100*n+75}</span>` : ` <span class="fx good">+100 · you move up.</span>`;
      const receipt = S.mode === "story" ? `<div class="receipt"><b>Receipt · ${esc(card.where)}</b>${esc(card.proof)}</div>` : "";
      say(r, esc(S.mode === "story" ? `"${exitLine(r, card.key)}"` : exitLine(r, card.key)) + chain, receipt);
      setTimeout(() => {
        S.rivals = S.rivals.filter(x => !leaving.includes(x));
        leaving.forEach(x => { if(r.leader && x !== r) x.group = null; });
        S.out = [...S.out, ...leaving.map(x => ({...x, leader:false}))]; // newest go to the very back
        APP.beaten.push(...leaving);
        S.lastOut = r.id;
        afterMove();
      }, 350);
      return;
    } else if(r.immune.includes(card.key)){
      S.score -= 30; S.backfires++;
      if(!r.immSeen.includes(card.key)) r.immSeen.push(card.key);
      el.classList.add("shake");
      let note;
      if(S.out.length){
        const back = S.out.shift();
        if(S.mode === "story"){
          const cid = Object.keys(S.beatBy).find(k => S.beatBy[k] === back.id);
          if(cid){ S.spent = S.spent.filter(x => x !== cid); delete S.beatBy[cid]; }
        }
        back.seen = true; S.score -= 100; S.gained--;
        S.cutBack = back;
        note = `<div class="receipt bad"><b>Backfire · you drop back a spot</b>${esc(r.name)} is immune to ${esc(keyLabel(card.key))}. While you were busy, ${esc(back.name)} cut back in front of you.${S.mode === "story" ? ` You already know what works on ${esc(back.name)}, so that card is back in your deck.` : ` You already know what works on ${esc(back.name)}.`}</div>`;
      } else {
        note = `<div class="receipt bad"><b>Backfire · immune to ${esc(keyLabel(card.key))}</b>${esc(r.name)} saw that coming. You're already at the back, so there's nowhere to drop. Try a different angle.</div>`;
      }
      say(r, `${esc(`"${r.bounce}"`)} <span class="fx bad">Backfire.</span>`, note);
      if(S.mode === "story" && S.lessonIdx < LESSONS.length){ const L = LESSONS[S.lessonIdx++]; setTimeout(() => showLesson(L), 700); }
    } else {
      el.classList.add("shake");
      if(!r.tried.includes(card.key)) r.tried.push(card.key);
      say(r, esc(pick(SHRUGS).replace("{n}", r.name)),
        `<div class="receipt"><b>Noted on ${esc(r.name)}'s tag</b>${esc(keyLabel(card.key))} doesn't work on ${esc(r.name)}. Don't waste another move on it.</div>`);
    }
  }
  setTimeout(() => {
    if(S.cutBack){ S.rivals.push(S.cutBack); S.lastOut = S.cutBack.id; S.cutBack = null; }
    afterMove();
  }, delay);
}

// Line twists run after every move
function afterMove(){
  S.busy = false;
  if(S.rivals.length === 0){ finishRun(true); return; }
  if(S.cutAt && !S.cutDone && S.used >= S.cutAt){
    S.cutDone = true;
    const friendOf = pick(S.rivals);
    const arch = pick(S.line.archetypes.slice(0, S.mode === "free" ? 8 : 6));
    const p = genPerson(S.line, arch, S.rng, S.names, 90 + S.used);
    p.tag = `${friendOf.name}'s friend`;
    S.rivals.push({...p, seen:false, immSeen:[], tried:[]});
    S.lastOut = p.id;
    say(host(), `${esc(friendOf.name)} waves someone over. "${esc(p.name)} is with me, I saved a spot!" <span class="fx bad">${esc(p.name)} cuts in ahead of you.</span>`);
  }
  if(S.hhAt && !S.hhOver && S.used >= S.hhAt){
    S.hhOver = true; S.cost = 2;
    $("liveText").textContent = "Happy hour over"; $("liveShort").textContent = "Over";
    $("street").classList.add("hh-over");
    say(host(), `Happy hour's over. <span class="fx bad">Every move now costs 2.</span>`);
  }
  if(S.stock !== null && S.stock !== undefined && S.stock <= 0){ finishRun(false, "soldout"); return; }
  if(S.moves < S.cost){ finishRun(false); return; }
  refillHand();
  render();
}

/* ---------- End of a run ---------- */
function finishRun(won, why){
  S.over = true;
  const bonus = won ? S.moves * 50 : 0;
  S.score += bonus;
  render();
  if(won) $("door").classList.add("open");
  if(S.mode === "story") return won ? storyWin(bonus) : storyLose();
  if(S.mode === "round") return roundEnd(won, bonus, why);
  return freeEnd(won, bonus, why);
}

function onPanelist(id){
  if(S.busy) return;
  const p = PANEL.find(x => x.id === id);
  const who = {name:p.role, title:"Wispr Flow", look:p.look};
  if(S.done[id]){ say(who, esc(`"${p.right || "You've got my attention."}"`)); return; }
  if(!S.sel){ say(who, esc(`"${p.q}"`)); return; }
  const cardId = S.sel; S.sel = null;
  if(id === "founder"){
    if(cardId === "lines"){ S.done.founder = true; render(); flipStep1(); return; }
    const leadsDone = S.done.growth && S.done.partners;
    S.founderTries++;
    say(who, esc(`"${leadsDone ? p.wrong : "Convince my team first. Then we'll talk."}"`), leadsDone ? `<div class="receipt bad"><b>None of your receipts work here</b>He's right, someone out there has more experience. You need a different kind of answer. Check your hand.</div>` : "");
    if(leadsDone) S.linesUnlocked = true;
    render(); return;
  }
  const card = CARDS.find(c => c.id === cardId);
  if(card && card.type === p.key){
    S.done[id] = true;
    say(who, esc(`"${p.right}"`), `<div class="receipt"><b>Receipt · ${esc(card.where)}</b>${esc(card.proof)}</div>`);
  } else {
    say(who, esc(`"${p.wrong}"`), `<div class="receipt bad"><b>Not the answer</b>Listen to the question again and pick the receipt that matches it.</div>`);
  }
  render();
}

  const finals = lineIds.map((lid, i) => genLine(LINES[lid], 1, r, {poolSize:8}).people[0]);

    <div class="slots">${finals.map((_, i) => `<div class="reel" id="reel${i}"><div class="reel-face"></div><div class="reel-name">&nbsp;</div><div class="reel-title">&nbsp;</div></div>`).join("")}</div>
    <p class="muted" id="slotCap">Names, moods, weak spots, even who's grouped with whom. Your three lines in a moment will be brand new too. In Free Play, one line is shared by everyone each day, so the leaderboard stays fair.</p>
    <div class="btns"><button class="btn" id="go" disabled>Spinning...</button></div>`, true);

    <p>You can switch lines any time from the strip above the street. Everything you've done in a line stays as you left it. Finish all three to see the leaderboard.</p>
    <div class="tiles">${LINE_ORDER.map((id, i) => {
      const L = LINES[id], d = APP.done[id], run = APP.runs[id];
      return `<div class="tile theme-${L.theme}">
        <div class="tile-art">${FACADE[L.theme]}</div>
        <div class="tile-what">${esc(L.what)} · ${esc(APP.names[i])}</div>
        <h3>${esc(L.brand)}</h3><p>${esc(L.blurb)}</p>
        ${d ? `<p class="prize">Finished · ${d.score} pts</p>` : `<button class="btn" data-pick="${id}">${run ? "Resume" : "Play this line"}</button>`}
      </div>`;
    }).join("")}</div>`, true);
  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => enterLine(b.dataset.pick));
}
function startRound(i){ enterLine(LINE_ORDER[i]); }
function enterLine(lid){
  if(S && S.busy) return;
  close();
  if(S && S.mode === "round" && !S.over) APP.runs[S.line.id] = S;
  const L = LINES[lid], i = LINE_ORDER.indexOf(lid);
  if(APP.runs[lid]){
    S = APP.runs[lid];
    dressScene(L.theme, {sign:L.brand, live:L.live, liveShort:L.shortLive});
    if(S.hhOver){ $("street").classList.add("hh-over"); $("liveText").textContent = "Happy hour over"; $("liveShort").textContent = "Over"; }
    render();
    say(host(), esc(`Welcome back, ${S.player.name}. Your spot is safe: ${ord(S.rivals.length + 1)} in line, ${S.moves} moves left.`));
    return;
  }
  newRun("round", lid, APP.names[i], PANEL[i].look);
  APP.runs[lid] = S;
  render();
  say(host(), `${esc(APP.names[i])} joins the line at ${esc(L.brand)}. ${esc(L.tagline)}. <span class="fx">Twist: ${esc(TWIST_TEXT[lid])}</span>`);
}
function renderSwitcher(){
  const sw = $("switcher");
  if(S.mode !== "round"){ sw.innerHTML = ""; sw.hidden = true; return; }
  sw.hidden = false;
  sw.innerHTML = LINE_ORDER.map((id, i) => {
    const L = LINES[id], d = APP.done[id], run = APP.runs[id], active = S.line.id === id;
    const status = d ? `Done · ${d.score} pts` : active ? "Now playing" : run ? `Paused · ${ord(run.rivals.length + 1)} in line` : "Not started";
    return `<button type="button" class="mini theme-${L.theme}${active ? " active" : ""}${d ? " done" : ""}" data-sw="${id}" ${d || active ? "disabled" : ""}>
      <span class="mini-art">${FACADE[L.theme]}</span>
      <span class="mini-txt"><b>${esc(L.brand)}</b><small>${esc(APP.names[i])} · ${esc(status)}</small></span>
    </button>`;
  }).join("");
  sw.querySelectorAll("[data-sw]").forEach(b => b.onclick = () => enterLine(b.dataset.sw));
}
function roundEnd(won, bonus, why){
  const L = S.line, name = S.player.name;
  APP.done[L.id] = {name, line:L.id, score:S.score, won, spot:S.rivals.length + 1};
  APP.results = LINE_ORDER.filter(id => APP.done[id]).map(id => APP.done[id]);
  delete APP.runs[L.id];
  renderSwitcher();
  const left = LINE_ORDER.filter(id => !APP.done[id]);
  say(host(), won ? "In you go." : why === "soldout" ? "That's it, sold out. Sorry." : "That's all for now.");
  setTimeout(() => {
    open(`<div class="kicker">${esc(L.brand)} · ${3 - left.length} of 3 lines finished</div>
      <h2>${won ? `${esc(name)} made it <i>in</i>.` : why === "soldout" ? `<i>Sold out</i> before ${esc(name)} got in.` : `${esc(name)} got stuck at <i>${ord(S.rivals.length + 1)}</i>.`}</h2>
      <div class="scoreline"><span class="stat">Score<b>${S.score}</b></span><span class="stat">Passed<b>${S.gained}</b></span>${won ? `<span class="stat">Moves left<b>${S.moves}</b> (+${bonus})</span>` : ""}<span class="stat">Backfires<b>${S.backfires}</b></span></div>
      <p class="note">This was a short line. <b>Full version:</b> 10 people, groups and chain combos, and a new line every day.</p>
      <div class="btns">${left.length
        ? left.map(id => `<button class="btn${APP.runs[id] ? "" : " alt"}" data-next="${id}">${APP.runs[id] ? "Resume" : "Play"} ${esc(LINES[id].brand)}</button>`).join("")
        : `<button class="btn" id="go">See today's leaderboard</button>`}</div>`);
    if(left.length) document.querySelectorAll("[data-next]").forEach(b => b.onclick = () => enterLine(b.dataset.next));
    else $("go").onclick = showBoard;
  }, 800);
}

/* ---------- Leaderboard + rewards ---------- */
function boardRows(){
  const r = mulberry32(hashStr(todayKey() + "|npc"));
  const npcs = [...LINEUP, {name:NARRATOR.name, title:"Security", id:"uncle"}].map(n => ({name:n.name, sub:n.title, score: Math.round((140 + r()*380)/10)*10, npc:true}));
  const players = APP.results.map(x => ({name:x.name, sub:LINES[x.line].brand, score:x.score, won:x.won, line:x.line, npc:false}));
  return [...players, ...npcs].sort((a,b) => b.score - a.score).map((x, i) => ({...x, rank:i+1}));
}
function rewardFor(row){
  if(row.npc) return "";
  const L = LINES[row.line];
  if(row.rank === 1) return `Wins ${L.prize} at ${L.brand}`;
  if(row.rank <= 3) return `10% off at ${L.brand}`;
  if(row.won) return `5% off at ${L.brand} for finishing`;
  return `No coupon today. New line tomorrow.`;
}
function showBoard(){
  close();
  const rows = boardRows();
  open(`<div class="kicker">Today's leaderboard</div>
    <h2>How the <i>panel</i> did.</h2>
    <table class="board"><thead><tr><th>#</th><th>Player</th><th>Score</th><th>Reward</th></tr></thead><tbody>
    ${rows.map(x => `<tr class="${x.npc ? "npc" : "me"}"><td>${x.rank}</td><td><b>${esc(x.name)}</b><br><span>${esc(x.sub)}</span></td><td>${x.score}</td><td>${esc(rewardFor(x))}</td></tr>`).join("")}
    </tbody></table>
    <p class="note">Rewards: #1 wins the line's prize, top 3 get 10% off, everyone who reaches the door gets 5%. The other names are the people you passed in Level 1, plus Security Uncle, who refuses to explain his score.</p>
    <div class="btns"><button class="btn" id="go">What's in it for a brand?</button></div>`, true);
  $("go").onclick = showPitch;
}
function showPitch(){
  open(`<div class="kicker">The partnership pitch</div>
    <h2>Turn the wait into the <i>marketing</i>.</h2>
    <p>Every hyped place in Bengaluru builds a line on purpose. Right now the line just makes people bored, and a bit annoyed. This makes it the best part.</p>
    <ul>
      <li><b>A line people play instead of resent.</b> Scan a QR in the queue, play while you wait.</li>
      <li><b>One daily seed.</b> Everyone faces the same line, so the leaderboard is fair and worth sharing.</li>

      <li><b>Rewards that pull people back.</b> #1 eats or drinks free, the top of the board gets 10%, everyone who finishes gets 5%.</li>
      <li><b>Every coupon is tied to an email.</b> Anyone can play, but you sign in to put your name on the leaderboard and claim a coupon. One account, one ranked run a day, so nobody farms rewards. And the brand finally sees the whole funnel: who played, who redeemed, and who actually turned up.</li>
      <li><b>Each brand gets its own window dressing.</b> A streetwear drop, a brunch spot, a taproom: same engine, new skin, new gags.</li>
    </ul>
    <p>Building and running partnerships like this is the job I want.</p>
    <div class="btns"><button class="btn" id="go">One last thing</button></div>`);
  $("go").onclick = finale;
}

/* ---------- Finale ---------- */
function finale(){
  const crowd = [...LINEUP, ...APP.beaten.filter(b => b.gen).slice(0, 6)];
  open(`<div class="finale">
    <div class="crowd">${crowd.map((c, i) => `<div class="fan" style="animation-delay:${(i%5)*0.12}s">${avatar(c.look)}${i % 3 === 0 ? `<span class="cheer">Hire him!</span>` : ""}</div>`).join("")}</div>
    <div class="front">
      ${PANEL.slice(0,1).map(p => `<div class="pp">${avatar(p.look)}<span>${esc(APP.names[0])}</span></div>`).join("")}
      <div class="pp me">${avatar({custom:"harsha"})}<span>Harsha</span></div>
      ${PANEL.slice(1).map((p, i) => `<div class="pp">${avatar(p.look)}<span>${esc(APP.names[i+1])}</span></div>`).join("")}
    </div>
    <h2>So... should you <i>hire me</i>?</h2>
    <p>Everyone you beat today seems to think so.</p>
    <div class="yesno" id="yesno"><button class="btn" id="yes">Yes</button><button class="btn alt" id="no">No</button></div>
    <div id="contact"></div>
  </div>`, true);
  // The "No" button dodges a few times, then gives up and becomes a yes.
  // One handler for every input: taps on phones never fire a second "mouseenter",
  // so the final switch must happen on click, not only on hover.
  const no = $("no");
  const LABELS = ["Are you sure?", "Really?", "Think of the 6 people you beat", "Last chance"];
  let dodges = 0, gaveUp = false;
  const dodge = (e) => {
    if(e) e.preventDefault();
    if(gaveUp){ sayYes(); return; }
    if(dodges >= LABELS.length){
      gaveUp = true;
      no.textContent = "Okay fine, yes";
      no.classList.remove("alt");
      no.style.left = "0px"; no.style.top = "0px";
      return;
    }
    dodges++;
    const box = $("yesno").getBoundingClientRect();
    no.style.position = "relative";
    no.style.left = `${Math.round(30 + Math.random() * Math.max(40, Math.min(200, box.width / 2 - 90)))}px`; // always away from Yes
    no.style.top = `${Math.round((Math.random()-.5) * 50)}px`;
    no.textContent = LABELS[dodges - 1];
  };
  let lastHover = 0;
  no.addEventListener("click", (e) => { if(Date.now() - lastHover < 400){ e.preventDefault(); return; } dodge(e); });
  // Only real mouse pointers get the run-away-on-hover trick
  if(window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches){
    no.addEventListener("mouseenter", () => { if(!gaveUp && dodges < LABELS.length){ lastHover = Date.now(); dodge(); } });
  }
  $("yes").onclick = sayYes;
}
function sayYes(){
  APP.storyDone = true; store.set("storyDone", true);
  $("yesno").innerHTML = "";
  $("contact").innerHTML = `<div class="contact">

    <a class="btn" href="mailto:imharsh9@gmail.com?subject=7th%20in%20line%3A%20let%27s%20talk">Email imharsh9@gmail.com</a>
    <a class="btn alt" href="https://www.linkedin.com/in/harsh-a-vardhan" target="_blank" rel="noopener">LinkedIn</a>
    <a class="btn alt" href="resume.pdf" download="Harsha_Vardhan_Resume.pdf">Download my resume</a>
    <p class="note">Free Play is now unlocked: three full lines, 10 people each, with groups and a new line every day.</p>
    <button class="btn alt" id="home">Back to the line</button>
  </div>`;
  $("home").onclick = goHome;
}
function goHome(){
  close();
  remixLineup();

}

/* ---------- Free Play ---------- */
function levelSelect(){

}
const FREE_LOOK = {skin:"#FFC48A", hair:"short", hc:"#1A1A1A", shirt:"#03504A", pants:"#CDB68E", shoes:"#fff", acc:[]};
function startFree(lid, name){
  close();
  newRun("free", lid, name, FREE_LOOK);
  render();
  const L = LINES[lid];
  say(host(), esc(`Welcome to ${L.brand}. ${L.tagline}. Ten ahead of you, ${S.moves} moves. Watch for the group leader.`));
}
function freeEnd(won, bonus, why){
  const L = S.line;
  const key = `board.${L.id}.${todayKey()}`;
  const board = store.get(key, []);
  board.push({name:S.player.name, score:S.score});

  setTimeout(() => {
    open(`<div class="kicker">Free Play · ${esc(L.brand)}</div>
      <h2>${won ? `You made it <i>in</i>.` : why === "soldout" ? `<i>Sold out.</i>` : `Stuck at <i>${ord(S.rivals.length + 1)}</i>.`}</h2>
      <p class="daily">Same line all day. New one tomorrow.</p>

      <table class="board"><thead><tr><th>#</th><th>Today on this device</th><th>Score</th></tr></thead><tbody>
      ${rows.map((x,i) => `<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${x.score}</td></tr>`).join("")}</tbody></table>
      <div class="btns"><button class="btn" id="again">Play this line again</button><button class="btn alt" id="lvl">Other lines</button></div>`);
    $("again").onclick = () => startFree(L.id, S.player.name);
    $("lvl").onclick = levelSelect;
  }, 800);
}
